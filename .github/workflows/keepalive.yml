name: EduHub 24/7 Keep-Alive Sentinel

on:
  schedule:
    - cron: '*/10 * * * *'  # Runs every 10 minutes (Render sleeps after 15 min)
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Heartbeat Ping EduHub Production
        run: |
          HTTP_STATUS=$(curl -s -L -o /dev/null -w "%{http_code}" --max-time 30 https://edumate.cam/health || echo "000")
          echo "Keep-Alive Ping to https://edumate.cam/health returned: HTTP $HTTP_STATUS"
          if [ "$HTTP_STATUS" = "200" ]; then
            echo "EduMate AI is fully awake and healthy."
          else
            echo "Instance was asleep or waking up. Retrying in 15 seconds..."
            sleep 15
            curl -s -L -o /dev/null -w "%{http_code}" --max-time 45 https://edumate.cam/health || true
          fi